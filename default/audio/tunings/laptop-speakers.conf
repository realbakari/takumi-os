# title: Laptop speakers
# about: Fuller sound and clearer voices from small built-in speakers, never distorted at full volume
# needs: swh-plugins (the limiter, fast_lookahead_limiter_1913)
#
# A speaker tuning is the filter graph PipeWire runs in front of the built-in speakers: the filter.graph of
# a filter-chain (https://docs.pipewire.org/page_module_filter_chain.html). takumi audio tuning adds the
# rest: two channels, the node names, and the speakers it stands in front of. This one is a gentle start
# that suits most laptops; a tuning measured for one model does better, and the hardware data names it.
filter.graph = {
    nodes = [
        {
            # One EQ for both channels. Small speakers cannot move air below about 120 Hz, and sending it
            # only makes them buzz; a little more from 150 to 300 Hz gives body; less around 600 Hz takes
            # out the boxy sound of a small case; a little more around 3.5 kHz brings voices forward.
            type  = builtin
            name  = eq
            label = param_eq
            config = {
                filters = [
                    { type = bq_highpass, freq = 120.0, q = 0.707 }
                    { type = bq_lowshelf, freq = 250.0, gain = 3.0, q = 0.707 }
                    { type = bq_peaking, freq = 600.0, gain = -2.0, q = 1.0 }
                    { type = bq_peaking, freq = 3500.0, gain = 2.0, q = 1.2 }
                ]
            }
        }
        {
            # Louder without distortion: 3 dB more in, and nothing ever above 1 dB below full scale.
            type   = ladspa
            name   = limiter
            plugin = fast_lookahead_limiter_1913
            label  = fastLookaheadLimiter
            control = {
                "Input gain (dB)"  = 3.0
                "Limit (dB)"       = -1.0
                "Release time (s)" = 0.08
            }
        }
    ]
    links = [
        { output = "eq:Out 1" input = "limiter:Input 1" }
        { output = "eq:Out 2" input = "limiter:Input 2" }
    ]
    inputs  = [ "eq:In 1" "eq:In 2" ]
    outputs = [ "limiter:Output 1" "limiter:Output 2" ]
}
