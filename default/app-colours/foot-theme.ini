# foot takes colours as RRGGBB, and its theme section is colors-dark (foot.ini(5)); colors-dark is the
# one foot starts with. The font is yours (takumi font); alpha is below 1 when the theme asks for glass.
font={{font_mono}}:size={{font_pt}}
[colors-dark]
alpha={{opacity}}
background={{background:bare}}
foreground={{foreground:bare}}
selection-background={{surface:bare}}
regular0={{background:bare}}
regular1={{red:bare}}
regular2={{green:bare}}
regular3={{yellow:bare}}
regular4={{blue:bare}}
regular5={{magenta:bare}}
regular6={{cyan:bare}}
regular7={{foreground:bare}}
bright0={{muted:bare}}
bright1={{red:bare}}
bright2={{green:bare}}
bright3={{yellow:bare}}
bright4={{blue:bare}}
bright5={{magenta:bare}}
bright6={{cyan:bare}}
bright7={{foreground:bare}}
