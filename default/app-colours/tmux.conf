# Rendered by takumi theme render for Tmux. Source from ~/.config/tmux/tmux.conf.
set -g status-style "bg={{surface}},fg={{foreground}}"
set -g message-style "bg={{surface}},fg={{accent}}"
set -g message-command-style "bg={{surface}},fg={{accent}}"
set -g pane-border-style "fg={{muted}}"
set -g pane-active-border-style "fg={{accent}}"
set -g window-status-style "fg={{muted}}"
set -g window-status-current-style "bg={{accent}},fg={{background}},bold"
set -g mode-style "bg={{accent}},fg={{background}}"
