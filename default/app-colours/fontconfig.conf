<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Your fonts (takumi font), for every app that asks fontconfig for the system's faces: Qt apps,
     browsers, Electron apps. Rendered by takumi theme render; linked as
     ~/.config/fontconfig/conf.d/60-takumi-fonts.conf. See fonts-conf(5). -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>{{font_ui}}</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>{{font_ui}}</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>{{font_mono}}</family></prefer>
  </alias>
</fontconfig>
