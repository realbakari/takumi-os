# Bluetooth headphones and headsets, for everyone on this computer. See docs/sound.md.
# Installed as /usr/share/wireplumber/wireplumber.conf.d/60-takumi-bluetooth.conf; a file of the same
# name in /etc/wireplumber/wireplumber.conf.d or ~/.config/wireplumber/wireplumber.conf.d wins.
# The settings are WirePlumber's own:
# https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/settings.html
# https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/bluetooth.html

wireplumber.settings = {
  # Music mode (A2DP) all the time, and headset mode (HSP/HFP, call quality, with the microphone) only
  # while an app records from the headset; the music mode comes back when the recording ends.
  bluetooth.autoswitch-to-headset-profile = true

  # A headset someone switched to headset mode by hand comes back in that mode.
  bluetooth.use-persistent-storage = true

  # When headphones go away, what was playing pauses instead of carrying on out of the speakers.
  linking.pause-playback = true
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        # A paired headset that is on and in range connects at login, and one that connected for music
        # alone also connects its microphone. BlueZ itself takes a trusted headset back when it comes
        # into range, and retries after a dropped link.
        bluez5.auto-connect = [ a2dp_sink hfp_hf hsp_hs ]
      }
    }
  }
]
