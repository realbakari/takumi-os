# MediaTek MT7925 Wi-Fi 7 & Bluetooth 5.4 combo card (common in 2024–2026 AMD laptops).
# Kernel driver: mt7925e / btusb; requires current linux-firmware.
title = "MediaTek MT7925 Wi-Fi 7 & Bluetooth"
part = "wifi"
works = "yes"
says = "uses MediaTek Wi-Fi 7 & BT firmware"

[match]
pci = ["14c3:7925", "14c3:0717"]

[apply]
packages = ["linux-firmware"]
note = "MediaTek MT7925 Wi-Fi 7 and Bluetooth 5.4 use the in-kernel mt7925e driver and current linux-firmware."
