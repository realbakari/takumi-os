[match]
dt_compatible = ["lenovo,thinkpad-t14s-gen6*", "lenovo,yoga-slim7x*", "dell,xps13-9345*", "asus,vivobook-s15*", "hp,omnibook-x14*", "qcom,x1p42100*"]
