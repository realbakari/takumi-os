# Headphones or a headset that connect become the output, as on a phone, and a USB headset's microphone
# the input. See docs/sound.md. Installed as /usr/share/pipewire/pipewire-pulse.conf.d/60-takumi-new-devices.conf.
# PipeWire's module-switch-on-connect makes a sink or source that appears the default; a screen's HDMI
# sound is left out (plugging in a monitor does not take the sound), and so are virtual devices such as the
# speaker tuning. A person can still pick any output in the Core, and that choice holds until the next
# device connects. https://docs.pipewire.org/page_pulse_module_switch_on_connect.html
pulse.cmd = [
  { cmd = "load-module" args = "module-switch-on-connect blocklist=hdmi" flags = [ "nofail" ] }
]
