# takumi sound quality: balanced
# Sound: Balanced. One sample rate for everything and a longer buffer: the least battery, and no crackles
# when the computer is busy. Put in ~/.config/pipewire/pipewire.conf.d/60-takumi-quality.conf by
# takumi audio quality balanced. See docs/sound.md and https://docs.pipewire.org/page_man_pipewire_conf_5.html
context.properties = {
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
}
