# takumi sound quality: studio
# Sound: Studio quality. The sound card follows each song's own sample rate (44.1 kHz from a CD, 96 kHz
# from a hi-res album) instead of converting it, and the buffer is a quarter as long, so playing an
# instrument or recording has a short delay. It uses a little more battery. Put in
# ~/.config/pipewire/pipewire.conf.d/60-takumi-quality.conf by takumi audio quality studio.
# See docs/sound.md and https://docs.pipewire.org/page_man_pipewire_conf_5.html
context.properties = {
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 32
}
