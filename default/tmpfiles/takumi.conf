# /run/takumi: the shell marks the desktop ready here (every user may write, nobody may list).
d /run/takumi 1733 root root -
d /var/lib/takumi/state 0755 root root -
# The login screen's copy of your theme: written by you (wheel), read by the greeter user.
d /var/lib/takumi/greeter 2775 root wheel -
