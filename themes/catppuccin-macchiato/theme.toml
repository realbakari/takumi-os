# Catppuccin Macchiato: pastels, a little brighter than Mocha
# Colours after Catppuccin (https://catppuccin.com); phases by Takumi.

[meta]
name = "catppuccin-macchiato"
mode = "dark"
title = "Catppuccin Macchiato"
about = "pastels, a little brighter than Mocha"
credit = "Catppuccin (https://catppuccin.com)"

[palette]
accent     = "#c6a0f6"
background = "#24273a"
surface    = "#2b2e44"
foreground = "#cad3f5"
muted      = "#6e738d"
red        = "#ed8796"
yellow     = "#eed49f"
green      = "#a6da95"
cyan       = "#8bd5ca"
blue       = "#8aadf4"
magenta    = "#f5bde6"

[phase.dawn]
accent     = "#f5a97f"

[phase.dusk]
accent     = "#ee99a0"

[phase.night]
accent     = "#9da2d6"
background = "#171926"
surface    = "#1e2030"
foreground = "#b6bedf"
