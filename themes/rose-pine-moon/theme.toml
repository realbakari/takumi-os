# Rosé Pine Moon: Rosé Pine under a paler moon
# Colours after Rosé Pine (https://rosepinetheme.com); phases by Takumi.

[meta]
name = "rose-pine-moon"
mode = "dark"
title = "Rosé Pine Moon"
about = "Rosé Pine under a paler moon"
credit = "Rosé Pine (https://rosepinetheme.com)"

[palette]
accent     = "#ea9a97"
background = "#232136"
surface    = "#2a273f"
foreground = "#e0def4"
muted      = "#6e6a86"
red        = "#eb6f92"
yellow     = "#f6c177"
green      = "#3e8fb0"
cyan       = "#9ccfd8"
blue       = "#3e8fb0"
magenta    = "#c4a7e7"

[phase.dawn]
accent     = "#f6c177"

[phase.dusk]
accent     = "#eb6f92"

[phase.night]
accent     = "#a78fc7"
background = "#171523"
surface    = "#1d1b2c"
foreground = "#c9c7dd"
