# Tokyo Night Storm: Tokyo Night under a softer, stormy sky
# Colours after Tokyo Night by folke (https://github.com/folke/tokyonight.nvim); phases by Takumi.

[meta]
name = "tokyo-storm"
mode = "dark"
title = "Tokyo Night Storm"
about = "Tokyo Night under a softer, stormy sky"
credit = "Tokyo Night by folke (https://github.com/folke/tokyonight.nvim)"

[palette]
accent     = "#7aa2f7"
background = "#24283b"
surface    = "#292e42"
foreground = "#c0caf5"
muted      = "#6a7297"
red        = "#f7768e"
yellow     = "#e0af68"
green      = "#9ece6a"
cyan       = "#7dcfff"
blue       = "#7aa2f7"
magenta    = "#bb9af7"

[phase.dawn]
accent     = "#ff9e64"

[phase.dusk]
accent     = "#fc9073"

[phase.night]
accent     = "#a085d5"
background = "#171a26"
surface    = "#1d202e"
foreground = "#adb7df"
