# Gruvbox Light: retro warmth on old paper
# Colours after Gruvbox by morhetz (https://github.com/morhetz/gruvbox); phases by Takumi.

[meta]
name = "gruvbox-light"
mode = "light"
title = "Gruvbox Light"
about = "retro warmth on old paper"
credit = "Gruvbox by morhetz (https://github.com/morhetz/gruvbox)"

[palette]
accent     = "#af3a03"
background = "#fbf1c7"
surface    = "#f2e5bc"
foreground = "#3c3836"
muted      = "#928374"
red        = "#9d0006"
yellow     = "#b57614"
green      = "#79740e"
cyan       = "#427b58"
blue       = "#076678"
magenta    = "#8f3f71"

[phase.dawn]
accent     = "#b57614"
background = "#fcf1d0"

[phase.dusk]
accent     = "#9d0006"

[phase.night]
accent     = "#963203"
background = "#f1e8c0"
surface    = "#e7dbb4"
foreground = "#4f4a44"
