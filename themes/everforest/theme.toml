# Everforest Dark: soft greens of a forest at dusk
# Colours after Everforest by sainnhe (https://github.com/sainnhe/everforest); phases by Takumi.

[meta]
name = "everforest"
mode = "dark"
title = "Everforest Dark"
about = "soft greens of a forest at dusk"
credit = "Everforest by sainnhe (https://github.com/sainnhe/everforest)"

[palette]
accent     = "#a7c080"
background = "#2d353b"
surface    = "#343f44"
foreground = "#d3c6aa"
muted      = "#859289"
red        = "#e67e80"
yellow     = "#dbbc7f"
green      = "#a7c080"
cyan       = "#83c092"
blue       = "#7fbbb3"
magenta    = "#d699b6"

[phase.dawn]
accent     = "#e69875"

[phase.dusk]
accent     = "#e68f79"

[phase.night]
accent     = "#70a39d"
background = "#1d2226"
surface    = "#242c30"
foreground = "#bfb59d"
