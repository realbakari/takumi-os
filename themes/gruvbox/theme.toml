# Gruvbox Dark: retro warmth: cream on brown-black
# Colours after Gruvbox by morhetz (https://github.com/morhetz/gruvbox); phases by Takumi.

[meta]
name = "gruvbox"
mode = "dark"
title = "Gruvbox Dark"
about = "retro warmth: cream on brown-black"
credit = "Gruvbox by morhetz (https://github.com/morhetz/gruvbox)"

[palette]
accent     = "#fabd2f"
background = "#282828"
surface    = "#32302f"
foreground = "#ebdbb2"
muted      = "#928374"
red        = "#fb4934"
yellow     = "#fabd2f"
green      = "#b8bb26"
cyan       = "#8ec07c"
blue       = "#83a598"
magenta    = "#d3869b"

[phase.dawn]
accent     = "#fe8019"

[phase.dusk]
accent     = "#fb4934"

[phase.night]
accent     = "#738e84"
background = "#1a1a1a"
surface    = "#232221"
foreground = "#d4c6a1"
