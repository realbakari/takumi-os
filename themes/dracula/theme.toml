# Dracula: vivid purples and pinks after midnight
# Colours after Dracula by Zeno Rocha (https://draculatheme.com); phases by Takumi.

[meta]
name = "dracula"
mode = "dark"
title = "Dracula"
about = "vivid purples and pinks after midnight"
credit = "Dracula by Zeno Rocha (https://draculatheme.com)"

[palette]
accent     = "#bd93f9"
background = "#282a36"
surface    = "#2f3241"
foreground = "#f8f8f2"
muted      = "#6272a4"
red        = "#ff5555"
yellow     = "#f1fa8c"
green      = "#50fa7b"
cyan       = "#8be9fd"
blue       = "#bd93f9"
magenta    = "#ff79c6"

[phase.dawn]
accent     = "#ffb86c"

[phase.dusk]
accent     = "#ff79c6"

[phase.night]
accent     = "#79c7d9"
background = "#1a1b23"
surface    = "#21232e"
foreground = "#dfdfdb"
