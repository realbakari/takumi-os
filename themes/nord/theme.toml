# Nord: arctic frost blues on polar night
# Colours after Nord by Arctic Ice Studio (https://www.nordtheme.com); phases by Takumi.

[meta]
name = "nord"
mode = "dark"
title = "Nord"
about = "arctic frost blues on polar night"
credit = "Nord by Arctic Ice Studio (https://www.nordtheme.com)"

[palette]
accent     = "#88c0d0"
background = "#2e3440"
surface    = "#3b4252"
foreground = "#d8dee9"
muted      = "#747f96"
red        = "#bf616a"
yellow     = "#ebcb8b"
green      = "#a3be8c"
cyan       = "#8fbcbb"
blue       = "#81a1c1"
magenta    = "#b48ead"

[phase.dawn]
accent     = "#d08770"

[phase.dusk]
accent     = "#d08770"

[phase.night]
accent     = "#557399"
background = "#1e222a"
surface    = "#292e39"
foreground = "#c4cad5"
