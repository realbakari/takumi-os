# Takumi foot. Colours come from the theme (include below); keys from Harmony.
include=~/.local/state/takumi/look/foot-theme.ini
pad=14x14
[cursor]
style=beam
blink=yes
[key-bindings]
# Harmony sends XF86Copy/XF86Paste for Super+C/V; foot honours them by default.
# Super+Z arrives as Ctrl+Z; keep job control out of reach of the Command key.
noop=Control+z
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal
font-decrease=Control+minus
