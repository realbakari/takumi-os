# Takumi: the desktop survives an app that eats the memory (docs/tuning.md). systemd-oomd watches the slices
# that ask it to (etc/systemd/user/app.slice.d/10-takumi.conf: your apps) and stops the app pressing on the
# memory hardest once the pressure has stayed high this long, before the kernel's own killer would pick something
# at random, or the screen freezes while zram fills. https://www.freedesktop.org/software/systemd/man/latest/oomd.conf.html
[OOM]
SwapUsedLimit=90%
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=20s
