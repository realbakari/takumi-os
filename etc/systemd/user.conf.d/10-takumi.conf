# Your own services stop within 10 seconds each, like the system's (etc/systemd/system.conf.d/10-takumi.conf,
# docs/boot.md); a unit that sets its own TimeoutStopSec= keeps it. They, and the apps you open, may open half a
# million files, not a thousand: games through Wine and Proton (esync), build tools and file sync (docs/tuning.md).
[Manager]
DefaultTimeoutStopSec=10s
DefaultLimitNOFILE=524288
