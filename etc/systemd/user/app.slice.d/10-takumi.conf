# Takumi: your apps live in this slice, each in its own scope (app-*.scope) when started from the Palette, a
# key or Files; systemd-oomd stops the one pressing hardest when the memory runs out, and the desktop (the shell,
# niri, sound) stays (docs/tuning.md, etc/systemd/oomd.conf.d/10-takumi.conf).
# https://www.freedesktop.org/software/systemd/man/latest/systemd.resource-control.html#ManagedOOMSwap=auto%7Ckill
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
ManagedOOMSwap=kill
