# Shutting down never waits a minute and a half on one service: a service that has not stopped after
# 10 seconds is ended (docs/boot.md). A unit that sets its own TimeoutStopSec= keeps it.
# Every program may open half a million files, not a thousand: games through Wine and Proton (esync), build tools
# and file sync open many at once (docs/tuning.md).
[Manager]
DefaultTimeoutStopSec=10s
DefaultLimitNOFILE=524288
