# Takumi: the boot splash starts right after systemd in the initramfs, so it is up before anything asks
# for a disk password (docs/boot.md). Sourced by mkinitcpio after mkinitcpio.conf.
if [[ " ${HOOKS[*]} " != *" plymouth "* ]]; then
  _takumi_hooks=()
  for _takumi_hook in "${HOOKS[@]}"; do
    _takumi_hooks+=("$_takumi_hook")
    [[ "$_takumi_hook" == systemd || "$_takumi_hook" == udev ]] && _takumi_hooks+=(plymouth)
  done
  HOOKS=("${_takumi_hooks[@]}")
  unset _takumi_hooks _takumi_hook
fi
