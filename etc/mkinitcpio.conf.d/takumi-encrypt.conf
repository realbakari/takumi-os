# Takumi: the disk is opened in the initramfs (sd-encrypt) with the keyboard already set (sd-vconsole), so
# the password types as it did when it was chosen; and every keyboard's driver is in it (keyboard before
# autodetect), so one plugged in later still types it. Installed by install/steps/30-boot.sh only when / is
# on an encrypted disk (docs/encryption.md). Sourced by mkinitcpio after mkinitcpio.conf.
_takumi_has() { [[ " ${HOOKS[*]} " == *" $1 "* ]]; }
if _takumi_has systemd && ! _takumi_has encrypt; then
  _takumi=()
  for _takumi_hook in "${HOOKS[@]}"; do
    case "$_takumi_hook" in
      sd-encrypt) ;;
      keyboard) _takumi_has autodetect || _takumi+=(keyboard) ;;
      autodetect) _takumi+=(keyboard autodetect) ;;
      block) _takumi_has sd-vconsole || _takumi+=(sd-vconsole); _takumi+=(block sd-encrypt) ;;
      *) _takumi+=("$_takumi_hook") ;;
    esac
  done
  HOOKS=("${_takumi[@]}")
  unset _takumi _takumi_hook
fi
unset -f _takumi_has
