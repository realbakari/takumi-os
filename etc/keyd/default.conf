# Harmony: Super is the universal Command key. See docs/harmony-keys.md.
[ids]
*

[main]
leftmeta = layer(cmd)
rightmeta = layer(cmd)

# Behaves as Meta by default, so niri's Super binds pass through untouched.
[cmd:M]
c = copy
v = paste
x = cut
z = C-z
a = C-a
s = C-s
f = C-f
w = C-w
t = C-t
n = C-n
, = C-,

[cmd+shift:M-S]
z = C-S-z
