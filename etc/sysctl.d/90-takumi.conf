# Desktop-tuned kernel knobs (install/steps/20-system.sh).
# Swap is zram, compressed memory, much faster than a disk: swapping into it early keeps more room for files
# in the page cache, and reading a page back costs little, so these values are the kernel documentation's
# advice for a zram-only system rather than for a disk.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
kernel.sysrq = 1
# Editors, file sync and build tools watch many files.
fs.inotify.max_user_watches = 524288
