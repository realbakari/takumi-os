# Takumi: ten wrong passwords in a row, at the login screen, the Lock, sudo or an approval, and the account waits
# two minutes before it takes another; a typo-prone evening never locks you out for long (docs/security.md).
# pam_faillock reads only /etc/security/faillock.conf, which belongs to pam: install/steps/27-security.sh sets
# these lines in it and leaves the rest as it is.
deny = 10
unlock_time = 120
